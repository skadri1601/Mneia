name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      allow_unverified_schema:
        description: >-
          Ship even though the running build does not report schemaVersion. Only for the one
          bootstrap deploy that introduces the field. Confirm production's schema version by hand
          first — this waives the gate that exists to stop MNE-254 happening again.
        type: boolean
        default: false
      skip_migrate:
        description: >-
          Ship without running the migrate job. For recovering an outage when the Neon API is
          unreachable but the database itself is fine — otherwise a control-plane failure blocks the
          deploy that would fix things. Production must already be on this build's schema version;
          the gate below still checks.
        type: boolean
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: migrate production
    if: ${{ !inputs.skip_migrate }}
    uses: ./.github/workflows/migrate-production.yml
    secrets: inherit

  ship:
    needs: [build, migrate]
    # A failed migration must stop the deploy. A deliberately skipped one must not — that is the
    # skip_migrate escape hatch, and without this the default needs semantics would swallow it.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Authorize the runner against the droplet
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Refuse to ship a build the production database cannot satisfy
        env:
          HEALTH_URL: https://${{ secrets.DEPLOY_PUBLIC_HOST }}/api/health
          ALLOW_UNVERIFIED_SCHEMA: ${{ inputs.allow_unverified_schema }}
        run: |
          if ! expected=$(node "${GITHUB_WORKSPACE}/scripts/schema-version.mjs"); then
            echo "::error::could not read the schema version this build expects from packages/core/src/store/migrations; refusing to deploy blind"
            exit 1
          fi

          if ! [[ "${expected}" =~ ^[0-9]+$ ]] || [ "${expected}" -lt 1 ]; then
            echo "::error::scripts/schema-version.mjs reported \"${expected}\", which is not a schema version; refusing to deploy blind"
            exit 1
          fi
          echo "this build expects schema version ${expected}"

          if ! health=$(curl -sS --max-time 15 "${HEALTH_URL}"); then
            echo "::warning::${HEALTH_URL} did not answer, so the running schema version could not be read. Shipping anyway — blocking here would stop a deploy that is recovering an outage. The post-deploy verification below still checks schema agreement."
            exit 0
          fi

          set +e
          applied=$(node "${GITHUB_WORKSPACE}/scripts/read-health-field.mjs" schemaVersion.applied <<< "${health}")
          read_status=$?
          set -e

          case "${read_status}" in
            0) ;;
            3)
              if [ "${ALLOW_UNVERIFIED_SCHEMA}" = "true" ]; then
                echo "::warning::the running build does not report schemaVersion and allow_unverified_schema was set, so the gate is waived for this run. Every deploy after this one is gated."
                exit 0
              fi
              echo "::error::the running build does not report schemaVersion, so this gate cannot tell whether production is migrated. Refusing to ship: on the one rollout that introduces the field, waving it through is exactly the MNE-254 outage. Confirm production's schema version by hand, then re-run this workflow from the Actions tab with allow_unverified_schema=true."
              exit 1
              ;;
            *)
              echo "::error::${HEALTH_URL} answered with something this gate could not read (${applied}). Refusing to ship: a gate that cannot read the schema version must fail closed, not wave the deploy through."
              exit 1
              ;;
          esac

          echo "the production database is at schema version ${applied}"

          if [ "${applied}" -lt "${expected}" ]; then
            echo "::error::production is at schema version ${applied} but this build expects ${expected}. Shipping it would serve code the database cannot satisfy, which is exactly MNE-254. The migrate job above should already have applied it, so reaching here means that job was skipped or its migration did not take — read its log rather than re-running this one."
            exit 1
          fi

      - name: Copy the compose and proxy definitions
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/Caddyfile deploy/docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/mneia/"

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MNEIA_INVITE_FROM: ${{ vars.MNEIA_INVITE_FROM }}
          MNEIA_APP_ORIGIN: ${{ vars.MNEIA_APP_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
             && cd /opt/mneia \
             && export MNEIA_WEB_IMAGE='${IMAGE}' \
             && export OPENAI_API_KEY='${OPENAI_API_KEY}' \
             && export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}' \
             && export SENTRY_DSN='${SENTRY_DSN}' \
             && export MNEIA_INVITE_FROM='${MNEIA_INVITE_FROM}' \
             && export MNEIA_APP_ORIGIN='${MNEIA_APP_ORIGIN}' \
             && export STRIPE_SECRET_KEY='${STRIPE_SECRET_KEY}' \
             && export STRIPE_PRICE_ID='${STRIPE_PRICE_ID}' \
             && export STRIPE_PRICE_ID_PRO='${STRIPE_PRICE_ID_PRO}' \
             && export STRIPE_WEBHOOK_SECRET='${STRIPE_WEBHOOK_SECRET}' \
             && docker compose pull \
             && docker compose up -d --remove-orphans \
             && docker image prune -f"

      - name: Wait for the deployed app to answer
        env:
          HEALTH_URL: https://${{ secrets.DEPLOY_PUBLIC_HOST }}/api/health
        run: |
          reader="${GITHUB_WORKSPACE}/scripts/read-health-field.mjs"

          for attempt in $(seq 1 30); do
            if curl -sS --max-time 10 -o /tmp/health.json "${HEALTH_URL}" \
              && node "${reader}" status < /tmp/health.json > /dev/null 2>&1; then
              echo "answered with a health report after ${attempt} attempt(s)"
              cat /tmp/health.json
              echo
              exit 0
            fi
            sleep 5
          done

          echo "::error::the deploy never returned a health report. The last response was:"
          head -c 500 /tmp/health.json || true
          exit 1

      # The deployed build classifies its own capabilities, so this step reads that manifest rather
      # than a list of field names kept by hand here. The hand-kept list is why billing sat
      # not_configured through three deploys (MNE-141): it was added to the health report and never
      # to this check. Required capabilities fail the deploy; advisory ones warn here and are chased
      # by health-watch.yml, which fails on every run until they are set.
      - name: Verify the deployed app rather than assuming it
        env:
          HEALTH_URL: https://${{ secrets.DEPLOY_PUBLIC_HOST }}/api/health
        run: |
          cat /tmp/health.json
          echo
          reader="${GITHUB_WORKSPACE}/scripts/read-health-field.mjs"
          failed=0

          read_field() {
            node "${reader}" "$1" < /tmp/health.json 2>/dev/null || echo "absent"
          }

          failing=$(read_field capabilities.failing)
          unconfigured=$(read_field capabilities.unconfigured)

          if [ "${failing}" = "absent" ] || [ "${unconfigured}" = "absent" ]; then
            echo "::error::the build now running does not report capabilities.failing and capabilities.unconfigured, so this step cannot tell which of its capabilities came up. A check that cannot read must fail closed rather than put a green tick over an unread health report - that is how billing stayed not_configured for days (MNE-141). Read ${HEALTH_URL} by hand and say what you found, or deploy a build that reports the manifest."
            exit 1
          fi

          detail=$(read_field detail)
          if [ "${detail}" = "absent" ]; then
            detail="the report gave no detail."
          fi

          if [ -n "${failing}" ]; then
            echo "::error::required capabilities did not come up on this deploy: ${failing//,/, }. The product does not work without them, so this run is a failure even though the container restarted. The build reported: ${detail}"
            failed=1
          fi

          if [ -n "${unconfigured}" ]; then
            echo "::warning::advisory capabilities are not configured on this deployment: ${unconfigured//,/, }. The app still serves, so this does not stop the deploy - blocking here would have stopped every lane for the days nobody had the Stripe keys. health-watch.yml fails on every run until they are set or deliberately retired. The build reported: ${detail}"
            {
              echo "### Advisory capabilities that did not come up"
              echo
              echo "\`${unconfigured//,/, }\` - advisory, so this deploy shipped anyway."
              echo
              echo "${detail}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          retired=$(read_field capabilities.retired)
          if [ -n "${retired}" ] && [ "${retired}" != "absent" ]; then
            echo "::notice::deliberately retired, so this deploy says nothing about them: ${retired//,/, }. The reason and its date are in CAPABILITY_TIERS - retiring is a reviewed code change, not a check somebody switched off."
          fi

          if [ "${failed}" -eq 0 ] && [ -z "${unconfigured}" ]; then
            echo "::notice::every capability the deployed build names came up: $(read_field capabilities.ready)"
          fi

          exit "${failed}"
