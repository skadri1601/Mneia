name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ship:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Authorize the runner against the droplet
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy the compose and proxy definitions
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/Caddyfile deploy/docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/mneia/"

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
             && cd /opt/mneia \
             && export MNEIA_WEB_IMAGE='${IMAGE}' \
             && export OPENAI_API_KEY='${OPENAI_API_KEY}' \
             && export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}' \
             && docker compose pull \
             && docker compose up -d --remove-orphans \
             && docker image prune -f"

      - name: Wait for the health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${{ secrets.DEPLOY_PUBLIC_HOST }}/api/health" > /dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "the deploy never became healthy; the previous container may still be serving"
          exit 1

      - name: Confirm the deployed app can reach the models
        run: |
          health=$(curl -fsS "https://${{ secrets.DEPLOY_PUBLIC_HOST }}/api/health")
          echo "$health"
          for field in extraction extractionFallback embeddings; do
            if ! echo "$health" | grep -q "\"${field}\":\"configured\""; then
              echo "::error::${field} is not configured, so this deploy degrades silently rather than failing"
              exit 1
            fi
          done
