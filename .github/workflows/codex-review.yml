name: codex-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the diff under review
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --stat "$BASE" "$HEAD" > /tmp/diffstat.txt
          git diff "$BASE" "$HEAD" > /tmp/full.diff
          echo "changed files: $(git diff --name-only "$BASE" "$HEAD" | wc -l)"
          echo "diff bytes: $(wc -c < /tmp/full.diff)"

      - name: Skip oversized diffs
        id: size
        run: |
          bytes=$(wc -c < /tmp/full.diff)
          if [ "$bytes" -gt 400000 ]; then
            echo "too_big=true" >> "$GITHUB_OUTPUT"
          else
            echo "too_big=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Codex
        if: steps.size.outputs.too_big == 'false'
        run: npm install -g @openai/codex

      - name: Review
        if: steps.size.outputs.too_big == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            printf 'Review this pull request. Follow .github/codex/pr-review.md exactly.\n\n'
            printf '## PR title\n\n%s\n\n' "$PR_TITLE"
            printf '## PR body\n\n%s\n\n' "$PR_BODY"
            printf '## Files changed\n\n```\n'
            cat /tmp/diffstat.txt
            printf '```\n\n## Diff\n\n```diff\n'
            cat /tmp/full.diff
            printf '\n```\n'
          } > /tmp/prompt.txt

          codex exec \
            --sandbox read-only \
            --skip-git-repo-check \
            - < /tmp/prompt.txt > /tmp/review.md 2>/tmp/codex.err || {
              echo "codex exec failed; stderr follows" >&2
              cat /tmp/codex.err >&2
              exit 1
            }

          test -s /tmp/review.md || { echo "codex produced no output" >&2; exit 1; }

      - name: Post the review
        if: steps.size.outputs.too_big == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            printf '## Codex review\n\n'
            cat /tmp/review.md
            printf '\n\n---\n_Automated. `.github/codex/pr-review.md` is the brief; edit it there, not here. Not a substitute for founder review before merge._\n'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md

      - name: Say why it was skipped
        if: steps.size.outputs.too_big == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "## Codex review

Skipped — the diff is over 400 KB, past the point where a single-pass review reads everything it claims to. A review that silently truncates is worse than none.

Split the PR, or run the review locally against the parts that matter:

\`\`\`
git diff main... > /tmp/full.diff
codex exec --sandbox read-only - < /tmp/full.diff
\`\`\`"
