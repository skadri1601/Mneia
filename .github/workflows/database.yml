name: Database

on:
  pull_request:
    paths:
      - 'packages/core/src/store/**'
      - 'packages/core/src/api/**'
      - 'packages/core/src/embed/**'
      - 'packages/core/src/extract/**'
      - 'packages/core/src/rehydrate/**'
      - 'packages/core/src/telemetry/**'
      - 'packages/core/src/trajectory/**'
      - 'packages/cli/src/**'
      - 'packages/mcp-server/src/**'
      - 'apps/web/src/server/**'
      - 'tests/integration/**'
      - 'scripts/db-migrate.mjs'
      - 'scripts/db-version.mjs'
      - 'scripts/schema-version.mjs'
      - 'db/structure.sql'
      - 'scripts/db-snapshot.mjs'
      - 'scripts/db-provision-app-role.mjs'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/src/store/**'
      - 'packages/core/src/api/**'
      - 'packages/core/src/embed/**'
      - 'packages/core/src/extract/**'
      - 'packages/core/src/rehydrate/**'
      - 'packages/core/src/telemetry/**'
      - 'packages/core/src/trajectory/**'
      - 'packages/cli/src/**'
      - 'packages/mcp-server/src/**'
      - 'apps/web/src/server/**'
      - 'tests/integration/**'
      - 'scripts/db-migrate.mjs'
      - 'scripts/db-version.mjs'
      - 'scripts/schema-version.mjs'
      - 'db/structure.sql'
      - 'scripts/db-snapshot.mjs'
      - 'scripts/db-provision-app-role.mjs'
      - '.github/workflows/database.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: integration suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mneia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mneia
      MNEIA_REQUIRE_DB: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: reject committed .only / .skip / .todo
        run: pnpm check:tests

      - name: build
        run: pnpm build

      - name: migrate the throwaway database
        run: pnpm db:migrate

      - name: the committed schema snapshot matches the migrations
        run: pnpm db:snapshot --check

      - name: run the suite against it
        run: npx vitest run
