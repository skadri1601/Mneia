name: Claude PR review

# Deliberately manual: one exact PR comment requests one review run.
on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          normalized="$(node -e "process.stdout.write((process.env.COMMENT_BODY ?? '').replace(/\\s+/gu, ' ').trim())")"
          if [ "$normalized" = "@claude review" ]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: anthropics/claude-code-action@v1
        if: steps.command.outputs.matched == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment Bash(gh *) Bash(git *)"'
