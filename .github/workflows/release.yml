name: Release

# Releases are automatic. A merge to main that carries a changeset makes the bot
# open or update a "Version Packages" PR holding the bump and the CHANGELOG.
# Merging THAT PR is the release: this workflow then publishes to npm and tags.
#
# Nothing publishes straight from a feature merge, so the version and the
# changelog are always visible before they become public and immutable.
#
# workflow_dispatch remains as an escape hatch for a re-run after a failed publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: refuse to act on a client that misreports its own version
        run: pnpm check:version

      - name: build the publishable packages
        run: pnpm build

      - name: open the version PR, or publish the one that was merged
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm release:publish
          commit: 'release: version the client packages'
          title: 'release: version the client packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
